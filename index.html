<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #111827;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
        }

        .brand h1 {
            font-size: 20px;
        }

        .brand span {
            font-size: 12px;
            color: #6b7280;
        }

        .header-buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .top-btn {
            background: #f3f4f6;
            padding: 9px 13px;
            border-radius: 9px;
            font-size: 14px;
        }

        .top-btn:hover {
            background: #e5e7eb;
        }

        /* CHAT */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 28px 18px 120px;
        }

        .welcome {
            max-width: 720px;
            margin: 60px auto 30px;
            text-align: center;
        }

        .welcome-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #6b7280;
        }

        .message {
            max-width: 850px;
            margin: 15px auto;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 5px;
        }

        /* INPUT */
        .input-area {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, #f5f7fb 25%);
            padding: 25px 18px 18px;
        }

        .input-box {
            max-width: 850px;
            margin: auto;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 16px;
            display: flex;
            align-items: center;
            padding: 7px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        #messageInput {
            flex: 1;
            border: none;
            outline: none;
            padding: 12px;
            font-size: 15px;
            background: transparent;
        }

        .input-btn {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: #f3f4f6;
            font-size: 18px;
            margin-left: 5px;
        }

        .send-btn {
            background: #2563eb;
            color: white;
        }

        .send-btn:hover {
            background: #1d4ed8;
        }

        /* MEMORY PANEL */
        .memory-panel {
            position: fixed;
            top: 0;
            right: -360px;
            width: 350px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 25px rgba(0,0,0,0.12);
            transition: right 0.25s ease;
            z-index: 10;
            padding: 20px;
        }

        .memory-panel.open {
            right: 0;
        }

        .memory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .memory-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .memory-delete {
            background: #fee2e2;
            padding: 7px 9px;
            border-radius: 8px;
        }

        .close-btn {
            background: #f3f4f6;
            padding: 8px 11px;
            border-radius: 8px;
        }

        /* DARK MODE */
        body.dark {
            background: #111827;
            color: #f9fafb;
        }

        body.dark .header,
        body.dark .input-box,
        body.dark .assistant .bubble,
        body.dark .memory-panel {
            background: #1f2937;
            border-color: #374151;
        }

        body.dark .top-btn,
        body.dark .input-btn,
        body.dark .close-btn {
            background: #374151;
            color: white;
        }

        body.dark .assistant .bubble {
            color: #f9fafb;
        }

        body.dark .memory-item {
            background: #111827;
            border-color: #374151;
        }

        body.dark .input-area {
            background: linear-gradient(transparent, #111827 25%);
        }

        body.dark #messageInput {
            color: white;
        }

        body.dark .welcome p,
        body.dark .brand span {
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            .header {
                padding: 0 12px;
            }

            .brand h1 {
                font-size: 17px;
            }

            .bubble {
                max-width: 88%;
            }

            .memory-panel {
                width: 100%;
                right: -100%;
            }

            .welcome {
                margin-top: 35px;
            }

            .welcome h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">
            <div class="logo">AI</div>

            <div>
                <h1>Mini AI</h1>
                <span>Personal AI Assistant</span>
            </div>
        </div>

        <div class="header-buttons">
            <button class="top-btn" onclick="toggleDark()">🌙</button>
            <button class="top-btn" onclick="showMemory()">🧠</button>
            <button class="top-btn" onclick="clearChat()">🗑️</button>
        </div>

    </header>


    <!-- CHAT -->
    <main class="chat" id="chat">

        <div class="welcome" id="welcome">

            <div class="welcome-icon">🤖</div>

            <h2>Hi, I'm Mini AI</h2>

            <p>
                Ask me anything — study, coding, technology or general questions.
            </p>

        </div>

    </main>


    <!-- INPUT -->
    <div class="input-area">

        <div class="input-box">

            <input
                id="messageInput"
                type="text"
                placeholder="Message Mini AI..."
                autocomplete="off"
            >

            <button
                class="input-btn"
                onclick="startVoice()"
                title="Voice"
            >
                🎤
            </button>

            <button
                class="input-btn send-btn"
                onclick="sendMessage()"
                title="Send"
            >
                ➤
            </button>

        </div>

    </div>

</div>


<!-- MEMORY PANEL -->
<div class="memory-panel" id="memoryPanel">

    <div class="memory-header">

        <h2>🧠 Memory</h2>

        <button
            class="close-btn"
            onclick="closeMemory()"
        >
            ✕
        </button>

    </div>

    <div id="memoryList">
        Loading...
    </div>

</div>


<script>

const input = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage() {

    const message = input.value.trim();

    if (!message) return;

    addMessage("user", message);

    input.value = "";

    if (welcome) {
        welcome.style.display = "none";
    }

    const typing = addMessage(
        "assistant",
        "Mini AI is thinking... 🤔"
    );

    try {

        const response = await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        typing.remove();

        addMessage(
            "assistant",
            data.reply
        );

        speak(data.reply);

    } catch (error) {

        typing.remove();

        addMessage(
            "assistant",
            "Connection error. Please make sure Mini AI is running."
        );

        console.log(error);
    }
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(role, text) {

    const wrapper = document.createElement("div");

    wrapper.className = "message " + role;

    const bubble = document.createElement("div");

    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;

    return wrapper;
}


/* =========================
   ENTER KEY
========================= */

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    }
);


/* =========================
   DARK MODE
========================= */

function toggleDark() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "miniAI_dark",
        document.body.classList.contains("dark")
    );
}


if (
    localStorage.getItem("miniAI_dark") === "true"
) {
    document.body.classList.add("dark");
}


/* =========================
   MEMORY
========================= */

async function showMemory() {

    const panel =
        document.getElementById("memoryPanel");

    panel.classList.add("open");

    const list =
        document.getElementById("memoryList");

    list.innerHTML = "Loading...";

    try {

        const response =
            await fetch("/memories");

        const data =
            await response.json();

        list.innerHTML = "";

        if (
            !data.memories ||
            data.memories.length === 0
        ) {

            list.innerHTML =
                "<p>No saved memories yet.</p>";

            return;
        }

        data.memories.forEach(
            function(memory) {

                const item =
                    document.createElement("div");

                item.className =
                    "memory-item";

                const text =
                    document.createElement("span");

                text.textContent = memory;

                const deleteButton =
                    document.createElement("button");

                deleteButton.className =
                    "memory-delete";

                deleteButton.textContent =
                    "🗑️";

                deleteButton.onclick =
                    function() {
                        deleteMemory(memory);
                    };

                item.appendChild(text);

                item.appendChild(
                    deleteButton
                );

                list.appendChild(item);
            }
        );

    } catch (error) {

        list.innerHTML =
            "Memory load error.";

        console.log(error);
    }
}


function closeMemory() {

    document
        .getElementById("memoryPanel")
        .classList.remove("open");
}


/* =========================
   DELETE MEMORY
========================= */

async function deleteMemory(memory) {

    try {

        const response =
            await fetch(
                "/delete-memory",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        memory: memory
                    })
                }
            );

        const data =
            await response.json();

        if (data.success) {

            showMemory();

        } else {

            alert(
                "Memory delete nahi ho payi."
            );
        }

    } catch (error) {

        console.log(error);

        alert("Delete error.");
    }
}


/* =========================
   CLEAR CHAT
========================= */

async function clearChat() {

    if (
        !confirm(
            "Clear all chat history?"
        )
    ) {
        return;
    }

    try {

        await fetch(
            "/clear",
            {
                method: "POST"
            }
        );

        chat.innerHTML = "";

        chat.appendChild(welcome);

        welcome.style.display = "block";

    } catch (error) {

        console.log(error);
    }
}


/* =========================
   VOICE INPUT
========================= */

function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert(
            "Voice input is not supported in this browser."
        );

        return;
    }

    const recognition =
        new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.start();

    recognition.onresult =
        function(event) {

            input.value =
                event.results[0][0].transcript;

            sendMessage();
        };

    recognition.onerror =
        function(error) {

            console.log(error);
        };
}


/* =========================
   AI VOICE
========================= */

function speak(text) {

    if (
        !window.speechSynthesis ||
        !text
    ) {
        return;
    }

    speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-IN";

    speech.rate = 1;

    speech.pitch = 1;

    speechSynthesis.speak(speech);
}

</script>

</body>
</html>
