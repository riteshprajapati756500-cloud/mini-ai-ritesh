<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini AI Ritesh</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #111827;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 65px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .brand h1 {
            font-size: 19px;
        }

        .brand p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            cursor: pointer;
        }

        .top-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 18px;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .welcome {
            text-align: center;
            margin-top: 12vh;
        }

        .robot {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #6b7280;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e5e7eb;
        }

        .user .bubble {
            background: #111827;
            color: white;
        }

        .input-area {
            padding: 15px 20px 20px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
        }

        .input-box {
            max-width: 1000px;
            margin: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #message {
            flex: 1;
            min-height: 48px;
            max-height: 130px;
            resize: none;
            border: 1px solid #d1d5db;
            border-radius: 14px;
            padding: 13px;
            font-size: 15px;
            outline: none;
        }

        #message:focus {
            border-color: #111827;
        }

        .send,
        .mic {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            font-size: 20px;
        }

        .send {
            background: #111827;
            color: white;
        }

        .mic {
            background: #f3f4f6;
        }

        .memory-panel {
            position: fixed;
            right: -350px;
            top: 0;
            width: 330px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 20px rgba(0,0,0,.15);
            z-index: 10;
            padding: 20px;
            transition: .3s;
        }

        .memory-panel.open {
            right: 0;
        }

        .memory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .memory-list {
            overflow-y: auto;
            height: calc(100vh - 100px);
        }

        .memory-item {
            padding: 12px;
            background: #f3f4f6;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .delete-memory {
            background: #fee2e2;
            border-radius: 7px;
            padding: 5px 8px;
        }

        body.dark {
            background: #111827;
            color: #f9fafb;
        }

        body.dark header,
        body.dark .input-area,
        body.dark .memory-panel {
            background: #1f2937;
            border-color: #374151;
        }

        body.dark .assistant .bubble {
            background: #1f2937;
            border-color: #374151;
        }

        body.dark #message {
            background: #111827;
            color: white;
            border-color: #4b5563;
        }

        body.dark .top-btn,
        body.dark .mic {
            background: #374151;
            color: white;
        }

        body.dark .welcome p,
        body.dark .brand p {
            color: #9ca3af;
        }

        @media (max-width: 600px) {
            header {
                padding: 0 10px;
            }

            .chat {
                padding: 15px;
            }

            .bubble {
                max-width: 88%;
            }

            .brand h1 {
                font-size: 16px;
            }

            .memory-panel {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header>
        <div class="brand">
            <div class="logo">🤖</div>
            <div>
                <h1>Mini AI Ritesh</h1>
                <p>Personal AI Assistant</p>
            </div>
        </div>

        <div class="actions">
            <button class="top-btn" onclick="toggleDark()" title="Dark Mode">🌙</button>
            <button class="top-btn" onclick="openMemory()" title="Memory">🧠</button>
            <button class="top-btn" onclick="clearChat()" title="Clear Chat">🗑️</button>
        </div>
    </header>

    <main class="chat" id="chat">

        <div class="welcome" id="welcome">
            <div class="robot">🤖</div>
            <h2>Hi, I'm Mini AI</h2>
            <p>Ask me anything and let's chat.</p>
        </div>

    </main>

    <div class="input-area">
        <div class="input-box">

            <textarea
                id="message"
                placeholder="Message Mini AI..."
                onkeydown="handleKey(event)"
            ></textarea>

            <button class="mic" onclick="startVoice()" title="Voice">🎤</button>

            <button class="send" onclick="sendMessage()" title="Send">➤</button>

        </div>
    </div>

</div>


<div class="memory-panel" id="memoryPanel">

    <div class="memory-header">
        <h2>🧠 Memory</h2>
        <button class="top-btn" onclick="closeMemory()">✕</button>
    </div>

    <div class="memory-list" id="memoryList">
        Loading...
    </div>

</div>


<script>

const chat = document.getElementById("chat");
const messageBox = document.getElementById("message");
const welcome = document.getElementById("welcome");


function addMessage(text, role) {

    if (welcome) {
        welcome.style.display = "none";
    }

    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    bubble.textContent = text;

    wrapper.appendChild(bubble);
    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;
}


async function sendMessage() {

    const message = messageBox.value.trim();

    if (!message) return;

    addMessage(message, "user");

    messageBox.value = "";

    const thinking = document.createElement("div");
    thinking.className = "message assistant";
    thinking.id = "thinking";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = "Thinking...";

    thinking.appendChild(bubble);
    chat.appendChild(thinking);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });

        const data = await response.json();

        thinking.remove();

        addMessage(
            data.reply || "Sorry, mujhe reply nahi mila.",
            "assistant"
        );

        speak(data.reply || "");

    } catch (error) {

        thinking.remove();

        addMessage(
            "Server se connection nahi ho pa raha.",
            "assistant"
        );
    }
}


function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }
}


function toggleDark() {

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );
}


if (localStorage.getItem("darkMode") === "true") {
    document.body.classList.add("dark");
}


async function clearChat() {

    try {

        await fetch("/clear", {
            method: "POST"
        });

        location.reload();

    } catch (error) {

        console.log(error);
    }
}


async function openMemory() {

    document.getElementById("memoryPanel")
        .classList.add("open");

    loadMemories();
}


function closeMemory() {

    document.getElementById("memoryPanel")
        .classList.remove("open");
}


async function loadMemories() {

    const list = document.getElementById("memoryList");

    try {

        const response = await fetch("/memories");

        const data = await response.json();

        list.innerHTML = "";

        if (!data.memories || data.memories.length === 0) {

            list.innerHTML = "<p>No saved memories yet.</p>";

            return;
        }

        data.memories.forEach((memory, index) => {

            const item = document.createElement("div");

            item.className = "memory-item";

            const text = document.createElement("span");

            text.textContent = memory;

            const del = document.createElement("button");

            del.className = "delete-memory";

            del.textContent = "🗑️";

            del.onclick = () => deleteMemory(memory);

            item.appendChild(text);
            item.appendChild(del);

            list.appendChild(item);

        });

    } catch (error) {

        list.innerHTML = "<p>Memory load nahi ho payi.</p>";
    }
}


async function deleteMemory(memory) {

    try {

        await fetch("/delete-memory", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                memory: memory
            })

        });

        loadMemories();

    } catch (error) {

        console.log(error);
    }
}


function startVoice() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert("Voice recognition is not supported in this browser.");

        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-IN";

    recognition.interimResults = false;

    recognition.start();

    recognition.onresult = function(event) {

        messageBox.value =
            event.results[0][0].transcript;

    };

}


function speak(text) {

    if (!text) return;

    if ("speechSynthesis" in window) {

        speechSynthesis.cancel();

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "en-IN";

        speech.rate = 1;

        speechSynthesis.speak(speech);
    }
}

</script>

</body>
</html>
